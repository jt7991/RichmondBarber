# TLS terminates at the hosting proxy. Apache still listens on port 80,
# but its directory-slash redirects must use the public HTTPS origin.
ServerName https://richmondbarbershop.com:443
UseCanonicalName On
UseCanonicalPhysicalPort Off

# public/.htaccess does not run here: the httpd image uses AllowOverride None
# and does not load mod_rewrite. mod_alias is already loaded.
# Search Console still has the legacy sitemap URL submitted.
RedirectMatch 301 ^/sitemap\.xml$ https://richmondbarbershop.com/sitemap-index.xml
